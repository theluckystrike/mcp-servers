name = "mcp-remote"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "dd3f2a29b7707e21a87f26a622c0bb9d"
workers_dev = true

# mcp-billing owns mcp.zovo.one as a custom domain; a route pattern is more
# specific than a custom domain, so /mcp* lands here and everything else there.
routes = [{ pattern = "mcp.zovo.one/mcp*", zone_name = "zovo.one" }]

[[kv_namespaces]]
binding = "REMOTE_DATA"
id = "cf848cc5c07d4e0a9c7c65ad1c70055c"

# Orphan sweep: anonymous tokens expire on their own (30-day KV TTL), the data
# documents they wrote do not. Daily at 04:00 UTC, delete ${tenant}:* for every
# tenant whose meta:<tenant> last_seen is older than 35 days.
[triggers]
crons = ["0 4 * * *"]

# pngjs's synchronous inflate subclasses node's internal zlib.Inflate, which is a real
# ES class on Workers, so every PNG decode threw "Class constructor Inflate cannot be
# invoked without 'new'". src/shims/pngjs.ts is the real pngjs with only PNG.sync.read
# re-implemented on zlib.inflateSync; the encoder and everything else are untouched.
[alias]
pngjs = "./src/shims/pngjs.ts"
