name = "mcp-billing"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "dd3f2a29b7707e21a87f26a622c0bb9d"
workers_dev = true
routes = [{ pattern = "mcp.zovo.one", custom_domain = true }]

[[kv_namespaces]]
binding = "LICENSES"
id = "75f8bf4872a0433285d11575cece8641"

# Shared with mcp-remote (remote/wrangler.toml): fulfilment writes bind:<anon_token>
# = the minted key so the hosted endpoints can treat that anonymous tenant as Pro.
[[kv_namespaces]]
binding = "REMOTE_DATA"
id = "cf848cc5c07d4e0a9c7c65ad1c70055c"

[[durable_objects.bindings]]
name = "FULFILLMENT"
class_name = "FulfillmentState"

[[migrations]]
tag = "fulfillment_state_v1"
new_sqlite_classes = ["FulfillmentState"]

[observability]
enabled = true

[observability.traces]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"
