name: npm publish (OIDC trusted publishing probe)

# Manual only. Never fires on push or tag.
#
# Purpose: empirically test whether npm trusted publishing (OIDC) can perform the
# FIRST-EVER publish of a package that does not yet exist on the registry. No
# NPM_TOKEN secret exists in this repository (`gh secret list` is empty), so this
# job has exactly one credential: the GitHub Actions OIDC id-token. If npm accepts
# it, every @theluckystrike/mcp-* package is published; if it rejects it, the exact
# registry error is captured as the evidence for docs/NPM_UNBLOCK_R2.md.
#
# Publish order note: `npm publish` never resolves a package's own dependencies
# against the registry, so the mcp-license <-> mcp-timezone dependency cycle
# documented in scripts/publish-all.sh does not constrain publish order. The loop
# below is plain alphabetical and is correct for that reason.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately NO `registry-url:` here. With registry-url,
      # actions/setup-node writes $RUNNER_TEMP/.npmrc containing
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and points
      # NPM_CONFIG_USERCONFIG at it; with no NODE_AUTH_TOKEN secret that
      # expands to the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX, so npm
      # authenticates with a junk bearer token and never attempts the OIDC
      # exchange. Run 34080853186 hit exactly that confound. Omitting
      # registry-url leaves npm with no credential at all, which is the
      # condition under which npm 11.5.1+ performs the OIDC token exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm past the trusted-publishing floor (11.5.1)
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v) / node $(node -v)"

      - name: Prove there is no npm credential and OIDC is available
        run: |
          echo "NPM_CONFIG_USERCONFIG=[${NPM_CONFIG_USERCONFIG:-unset}]"
          echo "NODE_AUTH_TOKEN=[${NODE_AUTH_TOKEN:+SET}${NODE_AUTH_TOKEN:-unset}]"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=[${ACTIONS_ID_TOKEN_REQUEST_URL:+PRESENT}${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}]"
          echo "--- every npmrc npm can see ---"
          for f in ~/.npmrc "$RUNNER_TEMP/.npmrc" ./.npmrc; do
            [ -f "$f" ] && { echo "### $f"; sed -E 's/(_authToken=)(.{0,6}).*/\1\2...REDACTED/' "$f"; } || echo "### $f (absent)"
          done
          echo "--- npm whoami (expected E401; OIDC does not create a session) ---"
          npm whoami || true

      - name: PROBE - OIDC first publish of one package
        id: probe
        continue-on-error: true
        run: |
          cd packages/mcp-license 2>/dev/null || cd servers/mcp-license
          pwd
          set -o pipefail
          npm publish --access public --provenance 2>&1 | tee /tmp/probe.log

      - name: Probe verdict
        run: |
          echo "probe outcome: ${{ steps.probe.outcome }}"
          echo "--- probe log ---"
          cat /tmp/probe.log || true

      - name: Publish every remaining package (only if the probe succeeded)
        if: steps.probe.outcome == 'success'
        run: |
          for d in packages/* servers/*; do
            [ -f "$d/package.json" ] || continue
            name=$(node -p "require('./$d/package.json').name")
            case "$name" in
              @theluckystrike/*) ;;
              *) continue ;;
            esac
            [ "$name" = "@theluckystrike/mcp-license" ] && continue
            echo "=== publishing $name ==="
            (cd "$d" && npm publish --access public --provenance) || echo "FAILED: $name"
          done

      - name: Verify on the registry
        if: always()
        run: |
          for p in mcp-license mcp-timezone mcp-invoice mcp-pdf mcp-bank; do
            printf '%-14s ' "$p"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://registry.npmjs.org/@theluckystrike/$p"
          done
