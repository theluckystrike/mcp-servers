name: Billing monitor watchdog

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare monitor heartbeat
        env:
          BILLING_MONITOR_STATUS_TOKEN: ${{ secrets.BILLING_MONITOR_STATUS_TOKEN }}
        run: node scripts/billing-monitor-watchdog.mjs
